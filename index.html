<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuinbeplantingsplan Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        botanic: {
                            50: '#f2f8f4',
                            100: '#e1f0e5',
                            600: '#2e6f40',
                            700: '#235732',
                            800: '#1b4327',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- PapaParse for CSV reading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .floating-panel {
            position: absolute;
            z-index: 40;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }
        .panel-resize-handle {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 14px;
            height: 14px;
            cursor: nwse-resize;
            background: linear-gradient(135deg, transparent 50%, #cbd5e1 50%);
            border-bottom-right-radius: 0.75rem;
            z-index: 45;
        }
        .zone-resize-handle {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 16px;
            height: 16px;
            cursor: nwse-resize;
            background: linear-gradient(135deg, transparent 50%, #2e6f40 50%);
            border-bottom-right-radius: 1rem;
            z-index: 25;
        }
        #canvas-viewport {
            cursor: grab;
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        #canvas-viewport:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen w-screen flex flex-col">

    <!-- Top Navbar -->
    <header class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center justify-between flex-shrink-0 z-50 shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-botanic-700 flex items-center justify-center text-white shadow-md">
                <i data-lucide="flower-2" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-slate-800 text-sm leading-tight">Tuinbeplantingsplan Studio</h1>
                <p class="text-[11px] text-slate-500">Brederodelaan 43, Ermelo • Live Cloud Sync Active</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <!-- Cloud Sync Status Badge -->
            <div id="cloud-status" class="flex items-center space-x-1.5 text-xs text-amber-600 bg-amber-50 px-2.5 py-1.5 rounded-lg border border-amber-200">
                <i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i>
                <span id="cloud-status-text">Verbinden met Firebase...</span>
            </div>

            <div class="hidden md:flex items-center space-x-1.5 text-xs text-slate-500 bg-slate-50 px-2.5 py-1.5 rounded-lg border border-slate-200">
                <i data-lucide="move" class="w-3.5 h-3.5 text-slate-400"></i>
                <span>Sleep om te pannen</span>
            </div>
            <button onclick="resetCanvasView()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium transition flex items-center space-x-1.5" title="Centreer kaart">
                <i data-lucide="compass" class="w-3.5 h-3.5"></i>
                <span>Centreer</span>
            </button>
            <button onclick="toggleAllZones()" id="btn-toggle-all" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium transition flex items-center space-x-1.5">
                <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                <span>Alles aan/uit</span>
            </button>
            <button onclick="resetAllPanelPositions()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium transition flex items-center space-x-1.5" title="Reset panelen">
                <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
                <span>Reset Panelen</span>
            </button>
            <button onclick="loadPlantDataFromSheet()" class="px-3 py-1.5 bg-botanic-700 hover:bg-botanic-800 text-white rounded-lg text-xs font-medium transition flex items-center space-x-1.5 shadow-sm">
                <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                <span>Sheet Vernieuwen</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <div id="canvas-viewport" class="relative flex-grow overflow-hidden"
         onmousedown="startPan(event)" onwheel="handleZoom(event)">

        <!-- Infinite Zoomable/Pannable Design Workspace -->
        <div id="design-canvas" class="absolute overflow-visible origin-top-left pointer-events-none" 
             style="left: 0px; top: 0px; width: 0px; height: 0px; transform: translate(0px, 0px) scale(1);">
             
            <!-- Canvas Container for Zones and Plants -->
            <div id="canvas-content-container" class="absolute inset-0 pointer-events-auto"></div>
        </div>

        <!-- FLOATING PANEL 1: Filters & Plant Catalogus -->
        <div id="floating-filter-panel" class="floating-panel bg-white/95 backdrop-blur-sm rounded-2xl border border-slate-200 flex flex-col overflow-hidden"
             style="left: 30px; top: 30px; width: 320px; height: 580px;"
             onmousedown="event.stopPropagation()">
            
            <!-- Panel Header (Draggable) -->
            <div class="panel-header bg-slate-100/90 border-b border-slate-200 px-3.5 py-2.5 flex items-center justify-between cursor-move flex-shrink-0"
                 onmousedown="initPanelDrag(event, 'filter')">
                <div class="flex items-center space-x-2">
                    <i data-lucide="search" class="w-4 h-4 text-botanic-700"></i>
                    <span class="font-bold text-slate-800 text-xs">Plantendatabase & Filters</span>
                </div>
                <div class="flex items-center space-x-1">
                    <button onclick="togglePanelMinimize('filter', event)" class="p-1 hover:bg-slate-200 rounded text-slate-500 transition minimize-btn" title="Minimizeren">
                        <i data-lucide="minimize-2" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>

            <!-- Panel Body Content -->
            <div class="panel-body-content flex-grow flex flex-col overflow-hidden p-3.5 space-y-3">
                <div id="sheet-status" class="text-[11px] text-slate-500 font-medium">Resultaten: Laden...</div>
                
                <!-- Search Input -->
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-2.5 w-3.5 h-3.5 text-slate-400"></i>
                    <input type="text" id="plant-search" oninput="filterPlants()" placeholder="Zoek op plantnaam, type..." 
                           class="w-full pl-8 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-botanic-600/30">
                </div>

                <!-- Filters -->
                <div class="grid grid-cols-2 gap-2">
                    <select id="filter-type" onchange="filterPlants()" class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-700 focus:outline-none">
                        <option value="">Alle typen</option>
                    </select>
                    <select id="filter-color" onchange="filterPlants()" class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-700 focus:outline-none">
                        <option value="">Alle kleuren</option>
                    </select>
                </div>

                <!-- Plants List Container -->
                <div id="plant-catalog-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-2 pr-1">
                    <!-- Dynamic Items -->
                </div>
            </div>

            <!-- Resize Handle -->
            <div class="panel-resize-handle" onmousedown="initPanelResize(event, 'filter')"></div>
        </div>

        <!-- FLOATING PANEL 2: Zone & Plant Manager -->
        <div id="floating-manager-panel" class="floating-panel bg-white/95 backdrop-blur-sm rounded-2xl border border-slate-200 flex flex-col overflow-hidden"
             style="left: 370px; top: 30px; width: 340px; height: 580px;"
             onmousedown="event.stopPropagation()">
            
            <!-- Panel Header (Draggable) -->
            <div class="panel-header bg-slate-100/90 border-b border-slate-200 px-3.5 py-2.5 flex items-center justify-between cursor-move flex-shrink-0"
                 onmousedown="initPanelDrag(event, 'manager')">
                <div class="flex items-center space-x-2">
                    <i data-lucide="layers" class="w-4 h-4 text-botanic-700"></i>
                    <span class="font-bold text-slate-800 text-xs">Vakken Beheer & Overzicht</span>
                </div>
                <div class="flex items-center space-x-1">
                    <button onclick="togglePanelMinimize('manager', event)" class="p-1 hover:bg-slate-200 rounded text-slate-500 transition minimize-btn" title="Minimizeren">
                        <i data-lucide="minimize-2" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>

            <!-- Panel Body Content -->
            <div class="panel-body-content flex-grow flex flex-col overflow-hidden p-3.5 space-y-3">
                <div class="flex items-center justify-between flex-shrink-0">
                    <span id="designer-zone-title" class="text-xs font-bold text-slate-800 truncate">Selecteer vak op canvas</span>
                </div>

                <!-- Plants in Selected Zone -->
                <div id="designer-zone-plants" class="flex-grow overflow-y-auto custom-scrollbar space-y-2 pr-1">
                    <p class="text-xs text-slate-400 text-center py-6">Klik op een vak in de tuinkaart om de inhoud te beheren.</p>
                </div>

                <!-- Add Selected Plant to Zone Button -->
                <button id="btn-add-plant-to-zone" onclick="addSelectedPlantToActiveZone()" class="w-full py-2 bg-botanic-700 hover:bg-botanic-800 text-white rounded-xl text-xs font-medium transition shadow-sm hidden flex items-center justify-center space-x-1.5 flex-shrink-0">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>Plant Toevoegen aan Vak</span>
                </button>
            </div>

            <!-- Resize Handle -->
            <div class="panel-resize-handle" onmousedown="initPanelResize(event, 'manager')"></div>
        </div>

    </div>

    <!-- Plant Detail Modal (rechts op het scherm, subtiele achtergrondvervaging, klik buiten om te sluiten) -->
    <div id="plant-detail-modal" class="fixed inset-0 bg-slate-900/10 backdrop-blur-[1px] z-50 hidden flex items-center justify-end p-6" onclick="handleModalBackdropClick(event)">
        <div id="plant-detail-dialog" class="bg-white rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden border border-slate-200 flex flex-col h-[85vh]">
            <div class="bg-botanic-700 text-white px-5 py-3.5 flex items-center justify-between flex-shrink-0">
                <h3 id="modal-plant-name" class="font-bold text-sm">Plant Informatie</h3>
                <button onclick="closePlantDetail()" class="text-white/80 hover:text-white p-1 rounded-lg transition">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <div id="modal-plant-content" class="p-5 space-y-4 flex-grow overflow-y-auto custom-scrollbar text-xs">
                <!-- Dynamic Content -->
            </div>
            <div class="bg-slate-50 px-5 py-4 border-t border-slate-200 flex flex-col space-y-3 flex-shrink-0">
                <div id="modal-size-container" class="flex flex-col space-y-1.5 text-xs">
                    <!-- Dynamic Plant Size Slider inside Popup -->
                </div>
                <button onclick="closePlantDetail()" class="w-full py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium rounded-xl text-xs transition">Sluiten</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & Cloud Sync Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQpPx2dcL_HkAnxs_PhSg582oFExs3fyQsFMsCZPzKG-NfYnuRYRiVNjEMGXDNesr1aYqTXBZvTn11I/pubhtml";

        // Jouw eigen Firebase Configuratie
        const firebaseConfig = {
            apiKey: "AIzaSyDAzU-GuXINIx0W-p9U1UR4JYh0UVezclo",
            authDomain: "plantenkaart.firebaseapp.com",
            projectId: "plantenkaart",
            storageBucket: "plantenkaart.firebasestorage.app",
            messagingSenderId: "200630330589",
            appId: "1:200630330589:web:a75e8375aab86624d8a734",
            measurementId: "G-GVBR3XRBWR"
        };

        window.allPlants = [];
        window.zones = [];
        window.panelLayouts = {
            filter: { x: 30, y: 70, w: 320, h: 580, minimized: false },
            manager: { x: 370, y: 70, w: 340, h: 580, minimized: false }
        };

        window.selectedZoneId = null;
        window.selectedPlantCatalogId = null;
        window.activeModalPlantInstance = null;

        // Viewport pan & zoom state
        window.panX = 150;
        window.panY = 100;
        window.scale = 1;
        window.isPanning = false;
        window.startPanX = 0;
        window.startPanY = 0;

        window.dragTarget = null;
        window.dragType = null;
        window.dragOffsetX = 0;
        window.dragOffsetY = 0;
        window.activePanelKey = null;

        let db = null;
        let auth = null;
        let saveTimeout = null;
        let isCloudConnected = false;

        window.addEventListener('DOMContentLoaded', async () => {
            applyPanelPositions();
            setupGlobalMouseEvents();
            updateCanvasTransform();
            if (window.lucide) lucide.createIcons();

            // Initialize Firebase met jouw eigen project
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                await signInAnonymously(auth);
                isCloudConnected = true;

                // Luister live naar wijzigingen in jouw Firestore database (voor realtime syncing over apparaten)
                const stateDocRef = doc(db, 'tuinontwerpen', 'hoofd_tuinkaart');
                
                onSnapshot(stateDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.zones && data.zones.length > 0) {
                            window.zones = data.zones;
                        }
                        if (data.panelLayouts) {
                            window.panelLayouts = data.panelLayouts;
                            applyPanelPositions();
                        }
                        renderDesignerCanvas();
                        renderZoneManagerPanel();
                        updateCloudStatus('synced', 'In jouw Firebase cloud opgeslagen');
                    } else {
                        // Nog geen document in cloud, sla eerste versie op
                        window.saveState();
                    }
                }, (error) => {
                    console.warn("Firestore luisteraar waarschuwing:", error);
                    updateCloudStatus('local', `Lokaal (Firestore fout: ${error.code || 'permission-denied'})`);
                    fallbackToLocalStorage();
                });

            } catch (e) {
                console.warn("Cloud init error, falling back to localStorage", e);
                updateCloudStatus('local', `Lokaal (Auth fout: ${e.code || 'niet actief'})`);
                fallbackToLocalStorage();
            }

            loadPlantDataFromSheet();
        });

        function fallbackToLocalStorage() {
            window.zones = JSON.parse(localStorage.getItem('garden_zones')) || [];
            window.panelLayouts = JSON.parse(localStorage.getItem('garden_panels_layout')) || window.panelLayouts;
            applyPanelPositions();
        }

        function updateCloudStatus(status, text) {
            const badge = document.getElementById('cloud-status');
            const txt = document.getElementById('cloud-status-text');
            if (!badge || !txt) return;

            badge.classList.remove('hidden', 'bg-amber-50', 'text-amber-600', 'border-amber-200', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-200', 'bg-slate-50', 'text-slate-600', 'border-slate-200');
            if (status === 'synced') {
                badge.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
                badge.innerHTML = `<i data-lucide="cloud-check" class="w-3.5 h-3.5"></i><span id="cloud-status-text">${text}</span>`;
            } else if (status === 'saving') {
                badge.classList.add('bg-amber-50', 'text-amber-600', 'border-amber-200');
                badge.innerHTML = `<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i><span id="cloud-status-text">${text}</span>`;
            } else {
                badge.classList.add('bg-slate-50', 'text-slate-600', 'border-slate-200');
                badge.innerHTML = `<i data-lucide="hard-drive" class="w-3.5 h-3.5"></i><span id="cloud-status-text">${text}</span>`;
            }
            if (window.lucide) lucide.createIcons();
        }

        window.saveState = function() {
            // Bewaar altijd lokaal als back-up
            localStorage.setItem('garden_zones', JSON.stringify(window.zones));
            localStorage.setItem('garden_panels_layout', JSON.stringify(window.panelLayouts));

            // Sla op in Firebase cloud
            if (!db || !isCloudConnected) return;
            updateCloudStatus('saving', 'Opslaan in Firebase...');
            if (saveTimeout) clearTimeout(saveTimeout);

            saveTimeout = setTimeout(async () => {
                try {
                    const stateDocRef = doc(db, 'tuinontwerpen', 'hoofd_tuinkaart');
                    await setDoc(stateDocRef, {
                        zones: window.zones,
                        panelLayouts: window.panelLayouts,
                        updatedAt: new Date().toISOString()
                    });
                    updateCloudStatus('synced', 'In jouw Firebase cloud opgeslagen');
                } catch (e) {
                    console.warn("Cloud save warning (saved locally):", e.message);
                    updateCloudStatus('local', 'Lokaal opgeslagen');
                }
            }, 500);
        }

        // --- Viewport & Canvas Controls ---
        window.updateCanvasTransform = function() {
            const canvas = document.getElementById('design-canvas');
            if (canvas) {
                canvas.style.transform = `translate(${window.panX}px, ${window.panY}px) scale(${window.scale})`;
            }
        }

        window.resetCanvasView = function() {
            window.panX = 200;
            window.panY = 150;
            window.scale = 1;
            updateCanvasTransform();
        }

        window.startPan = function(e) {
            if (e.target.closest('.floating-panel') || e.target.closest('.plant-dot') || e.target.closest('.zone-resize-handle') || e.target.closest('button') || e.target.closest('input') || e.target.closest('select')) return;
            window.isPanning = true;
            window.startPanX = e.clientX - window.panX;
            window.startPanY = e.clientY - window.panY;
            e.preventDefault();
        }

        window.handleZoom = function(e) {
            if (e.target.closest('.floating-panel')) return;
            e.preventDefault();
            
            const viewport = document.getElementById('canvas-viewport');
            const rect = viewport.getBoundingClientRect();
            
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            let prevScale = window.scale;
            if (e.deltaY < 0) {
                window.scale = Math.min(window.scale * 1.15, 3.0);
            } else {
                window.scale = Math.max(window.scale / 1.15, 0.3);
            }

            window.panX = mouseX - (mouseX - window.panX) * (window.scale / prevScale);
            window.panY = mouseY - (mouseY - window.panY) * (window.scale / prevScale);

            updateCanvasTransform();
        }

        window.applyPanelPositions = function() {
            Object.keys(window.panelLayouts).forEach(key => {
                const panel = document.getElementById(key === 'filter' ? 'floating-filter-panel' : 'floating-manager-panel');
                if (!panel) return;
                const conf = window.panelLayouts[key];
                panel.style.left = conf.x + 'px';
                panel.style.top = conf.y + 'px';
                panel.style.width = conf.w + 'px';
                
                const minBtn = panel.querySelector('.minimize-btn i');
                const bodyContent = panel.querySelector('.panel-body-content');
                const resizeHandle = panel.querySelector('.panel-resize-handle');

                if (conf.minimized) {
                    panel.style.height = 'auto';
                    if (bodyContent) bodyContent.classList.add('hidden');
                    if (resizeHandle) resizeHandle.classList.add('hidden');
                    if (minBtn) minBtn.setAttribute('data-lucide', 'maximize-2');
                } else {
                    panel.style.height = conf.h + 'px';
                    if (bodyContent) bodyContent.classList.remove('hidden');
                    if (resizeHandle) resizeHandle.classList.remove('hidden');
                    if (minBtn) minBtn.setAttribute('data-lucide', 'minimize-2');
                }
            });
            if (window.lucide) lucide.createIcons();
        }

        window.togglePanelMinimize = function(panelKey, e) {
            e.stopPropagation();
            window.panelLayouts[panelKey].minimized = !window.panelLayouts[panelKey].minimized;
            window.saveState();
            applyPanelPositions();
        }

        window.resetAllPanelPositions = function() {
            window.panelLayouts = {
                filter: { x: 30, y: 70, w: 320, h: 580, minimized: false },
                manager: { x: 370, y: 70, w: 340, h: 580, minimized: false }
            };
            window.saveState();
            applyPanelPositions();
            resetCanvasView();
        }

        window.toggleAllZones = function() {
            const allVisible = window.zones.every(z => z.visible);
            window.zones.forEach(z => z.visible = !allVisible);
            window.saveState();
            renderDesignerCanvas();
            renderZoneManagerPanel();
        }

        function setupGlobalMouseEvents() {
            window.addEventListener('mousemove', (e) => {
                if (window.isPanning) {
                    window.panX = e.clientX - window.startPanX;
                    window.panY = e.clientY - window.startPanY;
                    updateCanvasTransform();
                    return;
                }

                if (!window.dragType) return;

                if (window.dragType === 'panel-drag') {
                    let nx = e.clientX - window.dragOffsetX;
                    let ny = e.clientY - window.dragOffsetY;
                    window.panelLayouts[window.activePanelKey].x = Math.max(0, nx);
                    window.panelLayouts[window.activePanelKey].y = Math.max(0, ny);
                    applyPanelPositions();
                } else if (window.dragType === 'panel-resize') {
                    let nw = e.clientX + window.dragOffsetX - window.panelLayouts[window.activePanelKey].x;
                    let nh = e.clientY + window.dragOffsetY - window.panelLayouts[window.activePanelKey].y;
                    window.panelLayouts[window.activePanelKey].w = Math.max(260, nw);
                    window.panelLayouts[window.activePanelKey].h = Math.max(200, nh);
                    window.saveState();
                    applyPanelPositions();
                } else if (window.dragType === 'zone') {
                    const canvasRect = document.getElementById('design-canvas').getBoundingClientRect();
                    const zone = window.zones.find(z => z.id === window.dragTarget);
                    if (zone) {
                        zone.x = Math.max(0, (e.clientX - canvasRect.left) / window.scale - window.dragOffsetX);
                        zone.y = Math.max(0, (e.clientY - canvasRect.top) / window.scale - window.dragOffsetY);
                        renderDesignerCanvas();
                    }
                } else if (window.dragType === 'zone-resize') {
                    const canvasRect = document.getElementById('design-canvas').getBoundingClientRect();
                    const zone = window.zones.find(z => z.id === window.dragTarget);
                    if (zone) {
                        zone.w = Math.max(160, (e.clientX - canvasRect.left) / window.scale - zone.x + window.dragOffsetX);
                        zone.h = Math.max(140, (e.clientY - canvasRect.top) / window.scale - zone.y + window.dragOffsetY);
                        renderDesignerCanvas();
                    }
                } else if (window.dragType === 'plant') {
                    const canvasRect = document.getElementById('design-canvas').getBoundingClientRect();
                    const zone = window.zones.find(z => z.id === window.dragTarget.zoneId);
                    if (zone) {
                        const plantInst = zone.plants.find(p => p.instanceId === window.dragTarget.instanceId);
                        if (plantInst) {
                            let nx = (e.clientX - canvasRect.left) / window.scale - zone.x - window.dragOffsetX;
                            let ny = (e.clientY - canvasRect.top) / window.scale - zone.y - window.dragOffsetY;
                            plantInst.x = Math.max(16, Math.min(zone.w - 24, nx));
                            plantInst.y = Math.max(36, Math.min(zone.h - 24, ny));
                            renderDesignerCanvas();
                        }
                    }
                }
            });

            window.addEventListener('mouseup', () => {
                window.isPanning = false;
                if (window.dragType) {
                    window.dragType = null;
                    window.dragTarget = null;
                    window.saveState();
                }
            });
        }

        window.initPanelDrag = function(e, panelKey) {
            if (e.target.closest('button')) return;
            window.dragType = 'panel-drag';
            window.activePanelKey = panelKey;
            const conf = window.panelLayouts[panelKey];
            window.dragOffsetX = e.clientX - conf.x;
            window.dragOffsetY = e.clientY - conf.y;
            e.stopPropagation();
            e.preventDefault();
        }

        window.initPanelResize = function(e, panelKey) {
            window.dragType = 'panel-resize';
            window.activePanelKey = panelKey;
            const conf = window.panelLayouts[panelKey];
            window.dragOffsetX = conf.x - e.clientX;
            window.dragOffsetY = conf.y - e.clientY;
            e.stopPropagation();
            e.preventDefault();
        }

        window.initZoneDrag = function(e, zoneId) {
            if (e.target.closest('button') || e.target.closest('.plant-dot') || e.target.closest('.zone-resize-handle')) return;
            window.dragType = 'zone';
            window.dragTarget = zoneId;
            const zone = window.zones.find(z => z.id === zoneId);
            const canvasRect = document.getElementById('design-canvas').getBoundingClientRect();
            window.dragOffsetX = (e.clientX - canvasRect.left) / window.scale - zone.x;
            window.dragOffsetY = (e.clientY - canvasRect.top) / window.scale - zone.y;
            window.selectedZoneId = zoneId;
            renderZoneManagerPanel();
            renderDesignerCanvas();
            e.stopPropagation();
            e.preventDefault();
        }

        window.initZoneResize = function(e, zoneId) {
            window.dragType = 'zone-resize';
            window.dragTarget = zoneId;
            const zone = window.zones.find(z => z.id === zoneId);
            const canvasRect = document.getElementById('design-canvas').getBoundingClientRect();
            window.dragOffsetX = (canvasRect.left + zone.x * window.scale + zone.w * window.scale) - e.clientX;
            window.dragOffsetY = (canvasRect.top + zone.y * window.scale + zone.h * window.scale) - e.clientY;
            window.selectedZoneId = zoneId;
            e.stopPropagation();
            e.preventDefault();
        }

        window.initPlantDrag = function(e, zoneId, instanceId) {
            window.dragType = 'plant';
            window.dragTarget = { zoneId, instanceId };
            const canvasRect = document.getElementById('design-canvas').getBoundingClientRect();
            const zone = window.zones.find(z => z.id === zoneId);
            const plantInst = zone.plants.find(p => p.instanceId === instanceId);
            window.dragOffsetX = (e.clientX - canvasRect.left) / window.scale - zone.x - plantInst.x;
            window.dragOffsetY = (e.clientY - canvasRect.top) / window.scale - zone.y - plantInst.y;
            window.selectedZoneId = zoneId;
            e.stopPropagation();
            e.preventDefault();
        }

        window.loadPlantDataFromSheet = function() {
            const statusEl = document.getElementById('sheet-status');
            if (statusEl) statusEl.innerText = "Bezig met inladen Google Sheet...";

            let csvUrl = CSV_URL;
            if (csvUrl.includes('/pubhtml')) {
                csvUrl = csvUrl.replace('/pubhtml', '/pub?output=csv');
            }

            Papa.parse(csvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    processSheetData(results.data, statusEl);
                },
                error: function() {
                    const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(csvUrl);
                    Papa.parse(proxyUrl, {
                        download: true,
                        header: true,
                        skipEmptyLines: true,
                        complete: function(res) {
                            processSheetData(res.data, statusEl);
                        },
                        error: function() {
                            if (statusEl) statusEl.innerText = "Fout bij laden Google Sheet.";
                        }
                    });
                }
            });
        }

        function processSheetData(rows, statusEl) {
            if (!rows || rows.length === 0) {
                if (statusEl) statusEl.innerText = "Geen data gevonden in Google Sheet.";
                return;
            }

            window.allPlants = [];
            let csvZonesMap = {};

            rows.forEach((row, index) => {
                const name = row['Plantnaam'] || row['Naam'] || row['Plant'] || row[Object.keys(row)[0]];
                if (!name || name.trim() === '') return;

                const type = row['Type'] || row['Categorie'] || 'Vaste plant';
                const color = (row['Kleur'] || row['Bloemkleur'] || 'groen').toLowerCase().trim();
                const light = row['Standplaats'] || row['Licht'] || 'Zon';
                const height = row['Hoogte'] || '50cm';
                const bloom = row['Bloeitijd'] || 'Zomer';
                
                let zoneName = row['Vak'] || row['Zone'] || row['Tuinvak'] || 'Wenslijst';
                if (zoneName.toLowerCase() === 'hoofdvak') {
                    zoneName = 'Wenslijst';
                }

                const plantObj = {
                    id: 'plant-' + index,
                    name: name.trim(),
                    type: type.trim(),
                    color: color.trim(),
                    light: light.trim(),
                    height: height.trim(),
                    bloom: bloom.trim(),
                    raw: row
                };
                window.allPlants.push(plantObj);

                if (!csvZonesMap[zoneName]) {
                    csvZonesMap[zoneName] = [];
                }
                csvZonesMap[zoneName].push(plantObj);
            });

            // Houd bestaande posities/grootte vast als ze al bestaan
            let currentZones = window.zones || [];
            let newZones = [];
            let startX = 100;
            let startY = 100;
            let colCount = 0;

            Object.keys(csvZonesMap).forEach((zName, zIndex) => {
                let existingZone = currentZones.find(z => z.name === zName);
                
                let zPlants = csvZonesMap[zName].map((p, pIdx) => {
                    let existingP = existingZone?.plants?.find(ep => ep.plantId === p.id);
                    return {
                        instanceId: existingP ? existingP.instanceId : ('inst-' + zIndex + '-' + pIdx),
                        plantId: p.id,
                        x: existingP ? existingP.x : (40 + (pIdx % 4) * 80),
                        y: existingP ? existingP.y : (50 + Math.floor(pIdx / 4) * 70),
                        size: existingP ? (existingP.size || 26) : 26
                    };
                });

                if (existingZone) {
                    newZones.push({
                        ...existingZone,
                        name: zName,
                        plants: zPlants
                    });
                } else {
                    newZones.push({
                        id: 'zone-' + zIndex,
                        name: zName,
                        x: startX,
                        y: startY,
                        w: 420,
                        h: 360,
                        color: zName.toLowerCase().includes('wens') ? 'bg-emerald-50/95' : 'bg-green-50/95',
                        visible: true,
                        plants: zPlants
                    });
                    startX += 460;
                    colCount++;
                    if (colCount >= 3) {
                        startX = 100;
                        startY += 400;
                        colCount = 0;
                    }
                }
            });

            // Als we al zones uit cloud hadden, behouden we die volledig
            if (currentZones.length === 0) {
                window.zones = newZones;
            }

            if (statusEl) statusEl.innerText = `${window.allPlants.length} planten en ${window.zones.length} vakken geladen.`;
            populateFilterDropdowns();
            filterPlants();
            if (!window.selectedZoneId && window.zones.length > 0) {
                window.selectedZoneId = window.zones[0].id;
            }
            renderDesignerCanvas();
            renderZoneManagerPanel();
        }

        window.populateFilterDropdowns = function() {
            const typeSelect = document.getElementById('filter-type');
            const colorSelect = document.getElementById('filter-color');
            if (!typeSelect || !colorSelect) return;

            const types = [...new Set(window.allPlants.map(p => p.type))].filter(Boolean).sort();
            const colors = [...new Set(window.allPlants.map(p => p.color))].filter(Boolean).sort();

            typeSelect.innerHTML = `<option value="">Alle typen (${window.allPlants.length})</option>` + types.map(t => `<option value="${t}">${t}</option>`).join('');
            colorSelect.innerHTML = `<option value="">Alle kleuren</option>` + colors.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        window.filterPlants = function() {
            const query = (document.getElementById('plant-search')?.value || '').toLowerCase();
            const selectedType = document.getElementById('filter-type')?.value || '';
            const selectedColor = document.getElementById('filter-color')?.value || '';

            const filtered = window.allPlants.filter(p => {
                const matchQuery = p.name.toLowerCase().includes(query) || p.type.toLowerCase().includes(query);
                const matchType = !selectedType || p.type === selectedType;
                const matchColor = !selectedColor || p.color === selectedColor;
                return matchQuery && matchType && matchColor;
            });

            renderPlantCatalogList(filtered);
        }

        function renderPlantCatalogList(plants) {
            const container = document.getElementById('plant-catalog-list');
            if (!container) return;

            if (plants.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">Geen planten gevonden.</p>`;
                return;
            }

            container.innerHTML = plants.map(plant => {
                const colStyle = getPlantColorStyle(plant.color);
                const isSelected = window.selectedPlantCatalogId === plant.id;
                const borderClass = isSelected ? 'border-2 border-botanic-600 bg-botanic-50/50' : 'border-slate-200 hover:border-botanic-400 bg-slate-50/50';

                return `
                    <div onclick="selectPlantCatalog('${plant.id}')" 
                         class="border rounded-xl p-2.5 transition cursor-pointer flex items-center justify-between group ${borderClass}">
                        <div class="flex items-center space-x-2.5 truncate">
                            <div class="w-4 h-4 rounded-full flex-shrink-0 border shadow-sm" style="background-color: ${colStyle.bg}; border-color: ${colStyle.border};"></div>
                            <div class="truncate">
                                <p class="font-bold text-slate-800 text-xs truncate">${plant.name}</p>
                                <p class="text-[10px] text-slate-500 truncate">${plant.type} • <span class="capitalize">${plant.color}</span></p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1 flex-shrink-0">
                            <button onclick="event.stopPropagation(); openPlantDetail('${plant.id}')" class="p-1 hover:bg-slate-200 rounded text-slate-400 hover:text-slate-700 transition" title="Meer info">
                                <i data-lucide="info" class="w-3.5 h-3.5"></i>
                            </button>
                            <button onclick="event.stopPropagation(); quickAddPlantToFirstZone('${plant.id}')" class="p-1 hover:bg-botanic-100 rounded text-botanic-700 transition" title="Voeg toe aan vak">
                                <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            if (window.lucide) lucide.createIcons();
        }

        window.selectPlantCatalog = function(plantId) {
            window.selectedPlantCatalogId = plantId;
            filterPlants();
        }

        function getPlantColorStyle(colorName) {
            const c = (colorName || '').toLowerCase();
            if (c.includes('geel') || c.includes('yellow') || c.includes('goud')) return { bg: '#facc15', border: '#ca8a04', text: '#1e293b' };
            if (c.includes('roze') || c.includes('pink')) return { bg: '#f472b6', border: '#db2777', text: '#ffffff' };
            if (c.includes('paars') || c.includes('violet') || c.includes('lila')) return { bg: '#a855f7', border: '#7e22ce', text: '#ffffff' };
            if (c.includes('blauw') || c.includes('blue')) return { bg: '#3b82f6', border: '#1d4ed8', text: '#ffffff' };
            if (c.includes('wit') || c.includes('white')) return { bg: '#ffffff', border: '#94a3b8', text: '#0f172a' };
            if (c.includes('rood') || c.includes('red')) return { bg: '#ef4444', border: '#b91c1c', text: '#ffffff' };
            if (c.includes('oranje') || c.includes('orange')) return { bg: '#fb923c', border: '#c2410c', text: '#ffffff' };
            return { bg: '#22c55e', border: '#15803d', text: '#ffffff' };
        }

        window.toggleZoneVisibility = function(zoneId, e) {
            e.stopPropagation();
            const zone = window.zones.find(z => z.id === zoneId);
            if (zone) {
                zone.visible = !zone.visible;
                window.saveState();
                renderDesignerCanvas();
                renderZoneManagerPanel();
            }
        }

        window.renderDesignerCanvas = function() {
            const container = document.getElementById('canvas-content-container');
            if (!container) return;
            let html = '';

            window.zones.forEach(zone => {
                if (!zone.visible) return;
                const isSelected = window.selectedZoneId === zone.id;
                const borderClass = isSelected ? 'border-2 border-botanic-600 shadow-2xl ring-2 ring-botanic-200' : 'border border-slate-300 shadow-lg';

                html += `
                    <div class="absolute rounded-2xl ${zone.color} ${borderClass} transition-shadow flex flex-col overflow-hidden select-none"
                         style="left: ${zone.x}px; top: ${zone.y}px; width: ${zone.w}px; height: ${zone.h}px;"
                         onmousedown="initZoneDrag(event, '${zone.id}')"
                         onclick="selectZone('${zone.id}')">
                         
                        <div class="bg-white/95 backdrop-blur-sm px-3.5 py-2 border-b border-slate-200 flex items-center justify-between cursor-move">
                            <div class="flex items-center space-x-2 truncate">
                                <span class="font-bold text-slate-800 text-xs truncate">${zone.name}</span>
                                <span class="text-[10px] text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded-full">${zone.plants.length}</span>
                            </div>
                            <button onclick="toggleZoneVisibility('${zone.id}', event)" class="p-1 hover:bg-slate-200 rounded text-botanic-700 transition" title="Verberg vak">
                                <i data-lucide="eye" class="w-4 h-4"></i>
                            </button>
                        </div>

                        <div class="relative flex-grow">
                `;

                zone.plants.forEach(plantInst => {
                    const plantData = window.allPlants.find(p => p.id === plantInst.plantId) || { name: 'Onbekend', color: 'groen' };
                    const colStyle = getPlantColorStyle(plantData.color);
                    const size = plantInst.size || 26;

                    html += `
                        <div class="plant-dot absolute group cursor-pointer flex items-center justify-center transition-transform hover:scale-110"
                             style="left: ${plantInst.x - size/2}px; top: ${plantInst.y - size/2}px; width: ${size}px; height: ${size}px;"
                             onmousedown="initPlantDrag(event, '${zone.id}', '${plantInst.instanceId}')"
                             onclick="openPlantDetail('${plantData.id}', '${zone.id}', '${plantInst.instanceId}')"
                             title="${plantData.name} - Klik voor info & grootte">
                             
                            <div class="w-full h-full rounded-full shadow-md flex items-center justify-center text-[10px] font-bold border-2"
                                 style="background-color: ${colStyle.bg}; color: ${colStyle.text}; border-color: ${colStyle.border};">
                                •
                            </div>

                            <div class="absolute bottom-full mb-1 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-[10px] px-2 py-0.5 rounded shadow-lg whitespace-nowrap opacity-0 group-hover:opacity-100 pointer-events-none z-50">
                                ${plantData.name} (${size}px)
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                        <div class="zone-resize-handle" onmousedown="initZoneResize(event, '${zone.id}')" title="Sleep om vak te vergroten"></div>
                    </div>
                `;
            });

            container.innerHTML = html;
            if (window.lucide) lucide.createIcons();
        }

        window.selectZone = function(zoneId) {
            window.selectedZoneId = zoneId;
            renderDesignerCanvas();
            renderZoneManagerPanel();
        }

        window.renderZoneManagerPanel = function() {
            const titleEl = document.getElementById('designer-zone-title');
            const plantsContainer = document.getElementById('designer-zone-plants');
            const btnAdd = document.getElementById('btn-add-plant-to-zone');

            if (!window.selectedZoneId) {
                if (titleEl) titleEl.innerText = "Selecteer vak op canvas";
                if (plantsContainer) plantsContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">Klik op een vak in de tuinkaart om de inhoud te beheren.</p>`;
                if (btnAdd) btnAdd.classList.add('hidden');
                if (window.lucide) lucide.createIcons();
                return;
            }

            const zone = window.zones.find(z => z.id === window.selectedZoneId);
            if (!zone) return;

            if (titleEl) titleEl.innerText = `Inhoud van: ${zone.name}`;
            if (btnAdd) btnAdd.classList.remove('hidden');

            let pHtml = '';
            if (zone.plants.length === 0) {
                pHtml = `<p class="text-xs text-slate-400 text-center py-4">Geen planten in dit vak.</p>`;
            } else {
                zone.plants.forEach(plantInst => {
                    const plantData = window.allPlants.find(p => p.id === plantInst.plantId) || { name: 'Onbekend', color: 'groen' };
                    const colStyle = getPlantColorStyle(plantData.color);

                    pHtml += `
                        <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-2.5 space-y-2">
                            <div class="flex items-center justify-between gap-2">
                                <div class="flex items-center space-x-2 truncate">
                                    <div class="w-4 h-4 rounded-full flex-shrink-0 border shadow-sm" style="background-color: ${colStyle.bg}; border-color: ${colStyle.border};"></div>
                                    <div class="truncate">
                                        <p class="font-bold text-slate-800 text-xs truncate">${plantData.name}</p>
                                        <p class="text-[10px] text-slate-500">${plantData.type}</p>
                                    </div>
                                </div>
                                <button onclick="removePlantFromZone('${zone.id}', '${plantInst.instanceId}')" class="text-slate-400 hover:text-red-600 p-1 transition flex-shrink-0" title="Verwijder plant">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                            <div class="flex items-center space-x-2 pt-1 border-t border-slate-200/65 text-[11px]">
                                <span class="text-slate-500 font-medium">Grootte:</span>
                                <input type="range" min="14" max="70" step="2" value="${plantInst.size || 26}" 
                                       oninput="updatePlantSize('${zone.id}', '${plantInst.instanceId}', this.value)"
                                       class="flex-grow accent-botanic-600 cursor-pointer h-1.5 bg-slate-200 rounded-lg">
                                <span class="font-semibold text-slate-700 w-8 text-right">${plantInst.size || 26}px</span>
                            </div>
                        </div>
                    `;
                });
            }
            if (plantsContainer) plantsContainer.innerHTML = pHtml;
            if (window.lucide) lucide.createIcons();
        }

        window.updatePlantSize = function(zoneId, instanceId, newSize) {
            const zone = window.zones.find(z => z.id === zoneId);
            if (zone) {
                const p = zone.plants.find(x => x.instanceId === instanceId);
                if (p) {
                    p.size = parseInt(newSize) || 26;
                    window.saveState();
                    renderDesignerCanvas();
                }
            }
        }

        window.addSelectedPlantToActiveZone = function() {
            if (!window.selectedZoneId) {
                if (window.zones.length > 0) window.selectedZoneId = window.zones[0].id;
                else return;
            }
            if (!window.selectedPlantCatalogId && window.allPlants.length > 0) {
                window.selectedPlantCatalogId = window.allPlants[0].id;
            }
            if (!window.selectedPlantCatalogId) return;

            const zone = window.zones.find(z => z.id === window.selectedZoneId);
            if (zone) {
                zone.plants.push({
                    instanceId: 'inst-' + Math.random().toString(36).substring(2, 9),
                    plantId: window.selectedPlantCatalogId,
                    x: Math.floor(Math.random() * (zone.w - 80)) + 40,
                    y: Math.floor(Math.random() * (zone.h - 80)) + 40,
                    size: 26
                });
                window.saveState();
                renderDesignerCanvas();
                renderZoneManagerPanel();
            }
        }

        window.quickAddPlantToFirstZone = function(plantId) {
            window.selectedPlantCatalogId = plantId;
            if (!window.selectedZoneId && window.zones.length > 0) {
                window.selectedZoneId = window.zones[0].id;
            }
            window.addSelectedPlantToActiveZone();
        }

        window.removePlantFromZone = function(zoneId, instanceId) {
            const zone = window.zones.find(z => z.id === zoneId);
            if (zone) {
                zone.plants = zone.plants.filter(p => p.instanceId !== instanceId);
                window.saveState();
                renderDesignerCanvas();
                renderZoneManagerPanel();
            }
        }

        window.openPlantDetail = function(plantId, zoneId = null, instanceId = null) {
            const plant = window.allPlants.find(p => p.id === plantId);
            if (!plant) return;

            if (zoneId) {
                window.selectedZoneId = zoneId;
                renderDesignerCanvas();
                renderZoneManagerPanel();
            }

            document.getElementById('modal-plant-name').innerText = plant.name;
            const contentEl = document.getElementById('modal-plant-content');
            const sizeContainerEl = document.getElementById('modal-size-container');
            
            let rawHtml = '';
            if (plant.raw) {
                Object.keys(plant.raw).forEach(k => {
                    if (plant.raw[k]) {
                        rawHtml += `<div class="flex justify-between py-1 border-b border-slate-100"><span class="font-medium text-slate-500">${k}:</span><span class="text-slate-800 font-semibold text-right">${plant.raw[k]}</span></div>`;
                    }
                });
            }

            contentEl.innerHTML = `
                <div class="space-y-2">
                    <div class="bg-botanic-50 p-3 rounded-xl border border-botanic-100 space-y-1">

                        <p class="text-xs text-slate-700"><strong>Type:</strong> ${plant.type}</p>
                        <p class="text-xs text-slate-700"><strong>Kleur:</strong> <span class="capitalize">${plant.color}</span></p>
                        <p class="text-xs text-slate-700"><strong>Standplaats:</strong> ${plant.light}</p>
                        <p class="text-xs text-slate-700"><strong>Hoogte:</strong> ${plant.height}</p>
                    </div>
                    <div class="pt-2 space-y-1">
                        <p class="text-[11px] font-semibold text-slate-600">Google Sheet Details</p>
                        ${rawHtml || '<p class="text-xs text-slate-400">Geen extra gegevens.</p>'}
                    </div>
                </div>
            `;

            if (zoneId && instanceId) {
                window.activeModalPlantInstance = { zoneId, instanceId };
                const zone = window.zones.find(z => z.id === zoneId);
                const inst = zone?.plants.find(p => p.instanceId === instanceId);
                const currentSize = inst ? (inst.size || 26) : 26;

                sizeContainerEl.innerHTML = `
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-slate-600 font-medium">Grootte op kaart:</span>
                        <span id="modal-size-val" class="font-semibold text-slate-700">${currentSize}px</span>
                    </div>
                    <input type="range" min="14" max="70" step="2" value="${currentSize}" 
                           oninput="updateModalPlantSize('${zoneId}', '${instanceId}', this.value)"
                           class="w-full accent-botanic-600 cursor-pointer h-1.5 bg-slate-200 rounded-lg">
                `;
            } else {
                window.activeModalPlantInstance = null;
                sizeContainerEl.innerHTML = `<span class="text-slate-400 italic text-center">Selecteer plant op kaart om grootte aan te passen</span>`;
            }

            document.getElementById('plant-detail-modal').classList.remove('hidden');
        }

        window.updateModalPlantSize = function(zoneId, instanceId, newSize) {
            const zone = window.zones.find(z => z.id === zoneId);
            if (zone) {
                const p = zone.plants.find(x => x.instanceId === instanceId);
                if (p) {
                    p.size = parseInt(newSize) || 26;
                    const valSpan = document.getElementById('modal-size-val');
                    if (valSpan) valSpan.innerText = p.size + 'px';
                    window.saveState();
                    renderDesignerCanvas();
                    renderZoneManagerPanel();
                }
            }
        }

        window.closePlantDetail = function() {
            document.getElementById('plant-detail-modal').classList.add('hidden');
            window.activeModalPlantInstance = null;
        }

        window.handleModalBackdropClick = function(e) {
            if (e.target.id === 'plant-detail-modal') {
                closePlantDetail();
            }
        }
    </script>
</body>
</html>
